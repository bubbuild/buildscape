name: Sync Bub contrib
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Open a draft PR (main only)
        type: boolean
        default: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-bub-contrib
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LANDING_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ env.GH_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: Sync and validate
        id: sync
        run: |
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head catalog/bub-contrib --json number --jq length)" != 0 ]; then exit 0; fi
          git clone --depth 1 --branch main https://github.com/bubbuild/bub-contrib.git "$RUNNER_TEMP/contrib"
          echo "source=$(git -C "$RUNNER_TEMP/contrib" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          uv run --frozen python scripts/sync_bub_contrib.py "$RUNNER_TEMP/contrib"
          if git diff --quiet -- data.yml; then exit 0; fi
          uv run --frozen python -m unittest discover -s tests
          uv run --frozen python build.py
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        if: steps.sync.outputs.changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
        with:
          token: ${{ env.GH_TOKEN }}
          branch: catalog/bub-contrib
          base: main
          draft: always-true
          add-paths: data.yml
          commit-message: 'chore(catalog): sync Bub contrib plugins'
          title: 'chore(catalog): sync Bub contrib plugins'
          body: 'Update catalog metadata from bubbuild/bub-contrib@${{ steps.sync.outputs.source }}. Validation: sync tests and site build pass.'
